<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="google" content="notranslate">
<title>陪伴</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg-chat:#EDEDED;--bg-nav:#F7F7F7;--bg-input:#F7F7F7;--bubble-other:#FFF;--bubble-me:#95EC69;--text:#111;--text-secondary:#888;--accent:#07C160;--border:rgba(0,0,0,.08);--quote-bg:rgba(0,0,0,.05)}
body.dark{--bg-chat:#111;--bg-nav:#1C1C1C;--bg-input:#1C1C1C;--bubble-other:#2C2C2C;--bubble-me:#3EB575;--text:#E5E5E5;--text-secondary:#888;--border:rgba(255,255,255,.08);--quote-bg:rgba(255,255,255,.1)}

html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, "PingFang SC", sans-serif; font-size: 16px; color: var(--text); background: var(--bg-chat); }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.page { flex: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
.page.active { display: flex; }

.chat-header { height: 44px; background: var(--bg-nav); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 500; flex-shrink: 0; }
.chat-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
.msg { display: flex; gap: 8px; }
.msg.mine { flex-direction: row-reverse; }
.msg .avatar { width: 40px; height: 40px; border-radius: 4px; background: #ccc; flex-shrink: 0; }
.msg .bubble-wrap { max-width: 75%; display: flex; flex-direction: column; }
.msg.mine .bubble-wrap { align-items: flex-end; }

/* 气泡 */
.msg .bubble { padding: 8px 12px; border-radius: 8px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; background: var(--bubble-other); position: relative; }
.msg.mine .bubble { background: var(--bubble-me); }

/* 引用框 */
.quote-box { background: var(--quote-bg); font-size: 12px; padding: 4px 8px; border-radius: 4px; margin-bottom: 4px; color: var(--text-secondary); border-left: 2px solid var(--accent); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 状态与时间 */
.msg-status { font-size: 10px; color: var(--text-secondary); margin-top: 4px; text-align: right; }
.msg .time { font-size: 11px; color: var(--text-secondary); margin-top: 4px; display: none; }
.msg.show-time .time { display: block; }

.chat-input { display: flex; gap: 8px; padding: 8px; background: var(--bg-input); border-top: 1px solid var(--border); flex-shrink: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.chat-input input { flex: 1; padding: 8px 12px; border-radius: 4px; border: none; background: var(--bubble-other); color: var(--text); font-size: 15px; outline: none; }
.chat-input button { padding: 8px 16px; border-radius: 4px; border: none; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn-send { background: var(--accent); color: #fff; font-weight: 500; }

.tabbar { display: flex; background: var(--bg-nav); border-top: 1px solid var(--border); flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
.tabbar button { flex: 1; padding: 8px 0; background: none; border: none; font-size: 12px; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.tabbar button.active { color: var(--accent); }
.tabbar button .icon { font-size: 20px; }

.page-inner { padding: 12px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
.card-group { background: var(--bubble-other); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.card-group-header { padding: 10px 12px; background: var(--bg-nav); font-size: 14px; font-weight: 500; }
.card-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); font-size: 14px; gap: 8px; }
.card-item .content { flex: 1; word-break: break-all; }
.card-item .weight { font-size: 12px; color: var(--text-secondary); }
.card-item button { background: none; border: none; color: #e74c3c; font-size: 13px; padding: 4px; cursor: pointer; }
.add-row { display: flex; gap: 8px; margin-top: 12px; margin-bottom: 20px; }
.add-row input { flex: 1; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--bubble-other); color: var(--text); font-size: 14px; outline: none; }
.add-row button { padding: 8px 12px; border-radius: 4px; border: none; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }

.setting-row { background: var(--bubble-other); padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; gap: 12px; }
.setting-row input[type=number] { width: 70px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-size: 14px; text-align: center; }
.setting-row input[type=text] { flex: 1; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-size: 14px; text-align: right; outline: none; }
.section-title { font-size: 12px; color: var(--text-secondary); margin: 16px 4px 8px; }

.modal-mask { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
.modal-content { background: var(--bubble-other); padding: 16px; border-radius: 8px; width: 100%; max-width: 400px; }
.modal-content h3 { margin-bottom: 12px; font-size: 16px; color: var(--text); }
.modal-content textarea { width: 100%; height: 200px; padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-size: 14px; resize: none; outline: none; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
.modal-btns button { padding: 8px 16px; border-radius: 4px; border: none; font-size: 14px; cursor: pointer; }
.btn-cancel { background: var(--bg-nav); color: var(--text); }
.btn-confirm { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <div class="page active" id="page-chat">
    <div class="chat-header" id="chat-header">对方</div>
    <div class="chat-list" id="chat-list"></div>
    <div class="chat-input">
      <input id="msg-input" placeholder="输入消息…" onkeydown="if(event.key==='Enter')sendText()">
      <button class="btn-send" onclick="sendText()">发送</button>
    </div>
  </div>

  <div class="page" id="page-cards">
    <div class="page-inner">
      <div id="cards-list"></div>
      <div class="add-row">
        <input id="new-card" placeholder="单条添加…">
        <button onclick="addCard()">添加</button>
        <button onclick="openBatchModal()" style="background:#007aff">批量添加</button>
      </div>
    </div>
  </div>

  <div class="page" id="page-settings">
    <div class="page-inner">
      <div class="section-title">外观与体验</div>
      <div class="setting-row"><span>夜间模式</span><input type="checkbox" id="set-dark" onchange="updateSetting('dark',this.checked)"></div>
      <div class="setting-row"><span>系统名称</span><input type="text" id="set-name" onchange="updateSetting('sysName',this.value)"></div>
      <div class="setting-row"><span>时间戳常显</span><input type="checkbox" id="set-time" onchange="updateSetting('alwaysShowTime',this.checked)"></div>
      
      <div class="section-title">回复逻辑（发消息触发）</div>
      <div class="setting-row"><span>回复条数</span><span><input type="number" id="set-min-count" min="1" onchange="updateSetting('minCount',+this.value)"> ~ <input type="number" id="set-max-count" min="1" onchange="updateSetting('maxCount',+this.value)"></span></div>
      <div class="setting-row"><span>延迟（秒）</span><span><input type="number" id="set-min-delay" min="1" onchange="updateSetting('minDelay',+this.value)"> ~ <input type="number" id="set-max-delay" min="1" onchange="updateSetting('maxDelay',+this.value)"></span></div>
      <div class="setting-row"><span>已读不回概率（%）</span><input type="number" id="set-no-reply" min="0" max="100" onchange="updateSetting('noReplyChance',+this.value)"></div>
      <div class="setting-row"><span>连句功能（符号分隔）</span><input type="checkbox" id="set-multi" onchange="updateSetting('multiEnabled',this.checked)"></div>
      <div class="setting-row"><span>引用回复概率（%）</span><input type="number" id="set-quote" min="0" max="100" onchange="updateSetting('quoteChance',+this.value)"></div>
      
      <div class="section-title">主动消息（不用发消息也会收到）</div>
      <div class="setting-row"><span>开启主动消息</span><input type="checkbox" id="set-proactive" onchange="updateSetting('proactiveEnabled',this.checked)"></div>
      <div class="setting-row"><span>间隔（分钟）</span><span><input type="number" id="set-pro-min" min="1" onchange="updateSetting('proactiveMin',+this.value)"> ~ <input type="number" id="set-pro-max" min="1" onchange="updateSetting('proactiveMax',+this.value)"></span></div>

      <div class="section-title">数据</div>
      <div class="setting-row"><span>导出数据</span><button onclick="exportData()" style="padding:6px 12px;border-radius:4px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-size:13px">导出</button></div>
      <div class="setting-row"><span>重置所有数据</span><button onclick="resetData()" style="padding:6px 12px;border-radius:4px;border:1px solid #e74c3c;background:transparent;color:#e74c3c;font-size:13px">重置</button></div>
    </div>
  </div>

  <div class="tabbar">
    <button class="active" data-page="chat" onclick="switchTab('chat')"><span class="icon">💬</span>聊天</button>
    <button data-page="cards" onclick="switchTab('cards')"><span class="icon">🃏</span>字卡</button>
    <button data-page="settings" onclick="switchTab('settings')"><span class="icon">⚙️</span>设置</button>
  </div>
</div>

<div class="modal-mask" id="batch-modal">
  <div class="modal-content">
    <h3>批量添加字卡</h3>
    <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">每行一条内容。支持 <b># 分组名</b> 归类。<br>支持行尾写 <b>|w3</b> 表示权重3。</p>
    <textarea id="batch-input" placeholder="# 日常&#10;今天天气真好&#10;你吃饭了吗|w3&#10;&#10;# 撒娇&#10;抱抱我嘛"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeBatchModal()">取消</button>
      <button class="btn-confirm" onclick="submitBatch()">确认添加</button>
    </div>
  </div>
</div>

<script>
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const randInt = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);

const defaultSettings = {
  id:'main', dark:false, sysName:'对方',
  minCount:1, maxCount:2, minDelay:3, maxDelay:10,
  noReplyChance:10, 
  multiEnabled: false, separators:['，','。','…','~'],
  quoteChance: 30,
  alwaysShowTime: false,
  proactiveEnabled: false, proactiveMin: 10, proactiveMax: 30
};

let db = { settings: [], cards: [], messages: [] };

function loadDB() {
  try {
    db.settings = JSON.parse(localStorage.getItem('settings') || '[]');
    db.cards = JSON.parse(localStorage.getItem('cards') || '[]');
    db.messages = JSON.parse(localStorage.getItem('messages') || '[]');
  } catch(e) {}
}
function saveDB() {
  localStorage.setItem('settings', JSON.stringify(db.settings));
  localStorage.setItem('cards', JSON.stringify(db.cards));
  localStorage.setItem('messages', JSON.stringify(db.messages));
}

function weightedPick(items) {
  const total = items.reduce((s,i)=>s+Math.max(1,i.weight||1),0);
  let r = Math.random()*total;
  for (const it of items) { r -= Math.max(1,it.weight||1); if (r<=0) return it; }
  return items[items.length-1];
}
function pickN(items,n) {
  const pool=[...items], out=[];
  for (let i=0;i<n&&pool.length;i++) { const c=weightedPick(pool); out.push(c); pool.splice(pool.findIndex(x=>x.id===c.id),1); }
  return out;
}
function joinSegments(segs,seps) {
  if (segs.length<=1) return segs.join('');
  return segs.reduce((acc,s,i)=>i===0?s:acc+seps[randInt(0,seps.length-1)]+s,'');
}

let settings = {...defaultSettings};

function loadSettings() {
  let s = db.settings.find(x => x.id === 'main');
  if (s) settings = {...settings, ...s}; 
  else { db.settings.push(settings); saveDB(); }
  
  $('set-dark').checked = settings.dark;
  $('set-name').value = settings.sysName;
  $('set-min-count').value = settings.minCount;
  $('set-max-count').value = settings.maxCount;
  $('set-min-delay').value = settings.minDelay;
  $('set-max-delay').value = settings.maxDelay;
  $('set-no-reply').value = settings.noReplyChance;
  $('set-multi').checked = settings.multiEnabled;
  $('set-quote').value = settings.quoteChance;
  $('set-time').checked = settings.alwaysShowTime;
  
  $('set-proactive').checked = settings.proactiveEnabled;
  $('set-pro-min').value = settings.proactiveMin;
  $('set-pro-max').value = settings.proactiveMax;
  
  applyTheme();
  scheduleProactive();
}

function applyTheme() {
  document.body.classList.toggle('dark', !!settings.dark);
  $('chat-header').textContent = settings.sysName;
}

function updateSetting(key,value) {
  settings[key] = value;
  let idx = db.settings.findIndex(x => x.id === 'main');
  if (idx >= 0) db.settings[idx] = settings;
  saveDB();
  applyTheme();
  if (key === 'alwaysShowTime') renderMessages();
  if(key.includes('proactive')) scheduleProactive();
}

function switchTab(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
  $('page-'+name).classList.add('active');
  document.querySelector(`.tabbar button[data-page="${name}"]`).classList.add('active');
  if (name==='cards') renderCards();
}

function renderMessages() {
  const msgs = [...db.messages].sort((a,b)=>a.ts-b.ts);
  const list = $('chat-list'); list.innerHTML='';
  for (const m of msgs) list.appendChild(renderMessageEl(m));
  list.scrollTop = list.scrollHeight;
}

function renderMessageEl(m) {
  const el = document.createElement('div');
  const isMine = m.role === 'user';
  el.className = 'msg' + (isMine ? ' mine' : '') + (settings.alwaysShowTime ? ' show-time' : '');
  
  const av = document.createElement('div'); av.className='avatar';
  const wrap = document.createElement('div'); wrap.className='bubble-wrap';
  
  // 引用框
  if (m.quote) {
    const q = document.createElement('div');
    q.className = 'quote-box';
    q.textContent = '引用: ' + m.quote;
    wrap.appendChild(q);
  }
  
  const b = document.createElement('div'); b.className='bubble'; b.textContent=m.content;
  const t = document.createElement('div'); t.className='time';
  t.textContent = new Date(m.ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  wrap.appendChild(b); wrap.appendChild(t);
  
  // 已读状态
  if (isMine) {
    const s = document.createElement('div'); s.className='msg-status'; s.textContent='已读';
    wrap.appendChild(s);
  }
  
  el.appendChild(av); el.appendChild(wrap);
  
  // 点击气泡显示时间（如果没开常显）
  b.addEventListener('click', (e) => {
    if (!settings.alwaysShowTime) {
      el.classList.toggle('show-time');
    }
  });
  
  return el;
}

// ---------- 发送与自动回复 ----------
async function sendText() {
  const input = $('msg-input'); const text = input.value.trim();
  if (!text) return;
  
  db.messages.push({id:uid(),role:'user',type:'text',content:text,ts:Date.now()});
  saveDB();
  input.value=''; renderMessages();

  autoReply(text);
}

async function autoReply(userText) {
  if (Math.random()*100 < settings.noReplyChance) return;
  
  const cards = db.cards;
  if (!cards.length) return;
  
  const n = randInt(settings.minCount, settings.maxCount);
  const picked = pickN(cards, n);
  
  const isQuote = Math.random()*100 < settings.quoteChance;
  
  for (const card of picked) {
    await sleep(randInt(settings.minDelay, settings.maxDelay)*1000);
    
    let segs = [card.content];
    if (settings.multiEnabled && cards.length > 1 && Math.random() < 0.5) {
      const extra = pickN(cards.filter(c=>c.id!==card.id),1);
      segs = [...segs, ...extra.map(e=>e.content)];
    }
    const content = joinSegments(segs, settings.separators);
    
    const msgObj = {id:uid(), role:'other', type:'text', content, ts:Date.now()};
    if (isQuote && userText) {
      msgObj.quote = userText.slice(0, 20) + (userText.length > 20 ? '...' : '');
    }
    
    db.messages.push(msgObj);
    saveDB();
    renderMessages();
  }
}

// ---------- 主动消息 ----------
let proactiveTimer = null;
function scheduleProactive() {
  if (proactiveTimer) clearTimeout(proactiveTimer);
  if (!settings.proactiveEnabled) return;
  const min = Math.max(1, settings.proactiveMin);
  const max = Math.max(min, settings.proactiveMax);
  const ms = randInt(min * 60, max * 60) * 1000;
  proactiveTimer = setTimeout(() => {
    triggerProactiveMessage();
    scheduleProactive();
  }, ms);
}

async function triggerProactiveMessage() {
  const cards = db.cards;
  if (!cards.length) return;
  const picked = pickN(cards, randInt(1, 2));
  for (const card of picked) {
    db.messages.push({id:uid(),role:'other',type:'text',content:card.content,ts:Date.now()});
    saveDB(); renderMessages();
    await sleep(1500); 
  }
}

// ---------- 字卡管理 ----------
function renderCards() {
  const cards = db.cards;
  const c = $('cards-list'); c.innerHTML='';
  if (!cards.length) { c.innerHTML='<div style="text-align:center;color:var(--text-secondary);padding:40px 0;font-size:14px">还没有字卡，去下面添加</div>'; return; }
  
  // 按分组归类
  const groups = {};
  cards.forEach(card => {
    const g = card.group || '未分组';
    if(!groups[g]) groups[g] = [];
    groups[g].push(card);
  });

  for (const [gName, gCards] of Object.entries(groups)) {
    const gEl = document.createElement('div'); gEl.className='card-group';
    gEl.innerHTML = `<div class="card-group-header"><span>${gName}（${gCards.length}）</span></div>`;
    for (const card of gCards) {
      const item = document.createElement('div'); item.className='card-item';
      item.innerHTML = `<span class="content">${escapeHtml(card.content)}</span>${card.weight!==1?`<span class="weight">×${card.weight}</span>`:''}<button onclick="editWeight('${card.id}')">权重</button><button onclick="deleteCard('${card.id}')">删</button>`;
      gEl.appendChild(item);
    }
    c.appendChild(gEl);
  }
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function addCard() {
  const input = $('new-card'); const text = input.value.trim();
  if (!text) return;
  db.cards.push({id:uid(),content:text,weight:1,group:'未分组',enabled:true});
  saveDB(); input.value=''; renderCards();
}
function deleteCard(id) { if(!confirm('删除这张字卡？'))return; db.cards = db.cards.filter(x=>x.id!==id); saveDB(); renderCards(); }
function editWeight(id) {
  const card = db.cards.find(x=>x.id===id);
  const w = prompt('权重 1-10（越大越容易抽中）', String(card.weight||1));
  if (w===null) return;
  card.weight = Math.min(10,Math.max(1,parseInt(w)||1));
  saveDB(); renderCards();
}

// 批量添加解析
function openBatchModal() { $('batch-modal').style.display = 'flex'; $('batch-input').focus(); }
function closeBatchModal() { $('batch-modal').style.display = 'none'; }
function submitBatch() {
  const text = $('batch-input').value;
  const lines = text.split('\n');
  let currentGroup = '未分组';
  let count = 0;

  for (let line of lines) {
    line = line.trim();
    if (!line) continue;
    
    // 解析分组 # 分组名
    if (line.startsWith('#')) {
      currentGroup = line.slice(1).trim() || '未分组';
      continue;
    }
    
    // 解析权重 |w3
    let weight = 1;
    const wMatch = line.match(/\|w(\d+)$/);
    if (wMatch) {
      weight = Math.min(10, Math.max(1, parseInt(wMatch[1])));
      line = line.replace(/\|w\d+$/, '').trim();
    }
    
    if (line) {
      db.cards.push({id:uid(),content:line,weight,group:currentGroup,enabled:true});
      count++;
    }
  }
  
  saveDB();
  closeBatchModal();
  renderCards();
  alert(`成功添加 ${count} 条字卡`);
}

// ---------- 数据管理 ----------
function exportData() {
  const data = { settings: db.settings, cards: db.cards, messages: db.messages, exportedAt:Date.now() };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'companion-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function resetData() {
  if (!confirm('重置将清空所有数据，确定？')) return;
  db.settings = []; db.cards = []; db.messages = [];
  saveDB();
  alert('已重置，即将刷新'); location.reload();
}

// 初始化
loadDB();
loadSettings();
renderMessages();
renderCards();
</script>
</body>
</html>

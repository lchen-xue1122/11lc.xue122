<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Milk陪伴</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F2F2F7;--card:#FFF;--text:#000;--text-sub:#8E8E93;--border:#E5E5EA;--accent:#007AFF;--me:#D1D1D6}
body{font-family:-apple-system,"PingFang SC",sans-serif;height:100vh;overflow:hidden;background:var(--bg);color:var(--text)}
#app{height:100vh;height:100dvh;position:relative;overflow:hidden}

/* ============ 1. Milk 首页 (Home) ============ */
#page-home{position:absolute;inset:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center;z-index:100;transition:opacity 0.3s;background:var(--bg)}
.home-card{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,0.04);margin-bottom:20px}
.hc-date{font-size:13px;color:var(--text-sub);letter-spacing:1px;text-align:center;margin-bottom:8px}
.hc-greet{font-size:28px;font-weight:bold;text-align:center;margin-bottom:20px}
.hc-section{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.hc-section::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px}
.hc-status{background:var(--bg);border-radius:16px;padding:16px;display:flex;gap:12px;margin-bottom:16px}
.hc-status .icon{font-size:32px}
.hc-status .text h4{font-size:15px;margin-bottom:4px}
.hc-status .text p{font-size:13px;color:var(--text-sub);line-height:1.4}
.hc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hc-box{background:var(--bg);border-radius:16px;padding:16px}
.hc-box .ico{font-size:20px;margin-bottom:8px}
.hc-box .lbl{font-size:12px;color:var(--text-sub);margin-bottom:4px}
.hc-box .val{font-size:14px;font-weight:600}
.hc-btn{background:var(--accent);color:#fff;text-align:center;padding:16px;border-radius:16px;font-size:16px;font-weight:600;margin-top:20px;cursor:pointer}

/* ============ 2. Milk 聊天页 ============ */
#page-chat{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:50}
#page-chat.show{opacity:1;pointer-events:all}
.chat-top{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border);z-index:10}
.ct-user{display:flex;align-items:center;gap:10px;cursor:pointer}
.ct-av{width:36px;height:36px;border-radius:50%;background:#CCC;background-size:cover;background-position:center}
.ct-info{display:flex;flex-direction:column}
.ct-name{font-size:16px;font-weight:600}
.ct-status{font-size:12px;color:var(--text-sub)}

.chat-mid{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;z-index:1}
.time-center{text-align:center;font-size:12px;color:var(--text-sub);margin:10px 0}
.msg{display:flex;gap:10px;max-width:85%;position:relative;animation:fadeIn 0.3s}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg.other{align-self:flex-start}
.msg .av{width:36px;height:36px;border-radius:50%;background:#CCC;background-size:cover;flex-shrink:0}
.msg .wrap{display:flex;flex-direction:column}
.msg.mine .wrap{align-items:flex-end}
.bubble{background:var(--card);padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;box-shadow:0 1px 4px rgba(0,0,0,0.05);word-break:break-word;cursor:pointer;border:1px solid var(--border)}
.msg.mine .bubble{background:var(--me);border-color:transparent;border-top-right-radius:4px;color:#000}
.msg.other .bubble{border-top-left-radius:4px}

.chat-bottom{padding:10px 16px 20px;background:var(--card);border-top:1px solid var(--border)}
.input-bar{background:var(--bg);border-radius:20px;display:flex;align-items:center;padding:4px 12px}
.icon-btn{width:36px;height:36px;display:flex;justify-content:center;align-items:center;font-size:20px;cursor:pointer;color:var(--text-sub);background:transparent;border:none;flex-shrink:0}
.input-bar input{flex:1;border:none;background:transparent;padding:8px;font-size:15px;outline:none;color:var(--text)}

/* 原版长按菜单 */
.ctx-menu{position:fixed;background:#1a1a1a;border-radius:12px;display:flex;padding:10px;gap:16px;box-shadow:0 5px 20px rgba(0,0,0,0.3);z-index:999;opacity:0;pointer-events:none;transform:scale(0.95);transition:all 0.2s;color:#fff}
.ctx-menu.show{opacity:1;pointer-events:all;transform:scale(1)}
.ctx-item{display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;opacity:0.9}

/* ============ 3. Milk 设置面板 ============ */
#page-settings{position:absolute;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;transform:translateX(100%);transition:transform 0.3s}
#page-settings.show{display:flex;transform:translateX(0)}
.set-hdr{height:50px;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600;border-bottom:1px solid var(--border)}
.set-back{font-size:20px;cursor:pointer;padding:10px;color:var(--accent)}
.set-inner{flex:1;overflow-y:auto;padding:20px}
.s-group{background:var(--card);border-radius:12px;padding:0 16px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,0.02)}
.s-title{font-size:13px;color:var(--text-sub);padding:16px 0 8px;font-weight:600}
.s-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);font-size:15px;gap:12px;cursor:pointer}
.s-row:last-child{border:none}
.s-row input[type=text]{flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;text-align:right;outline:none;background:var(--bg);color:var(--text)}
.btn-up{padding:6px 12px;background:var(--bg);border-radius:6px;font-size:13px;cursor:pointer;color:var(--text);border:1px solid var(--border)}

/* ============ 新增功能弹窗 (无缝融入) ============ */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;justify-content:center;align-items:center;padding:20px}
.m-box{background:var(--card);padding:20px;width:100%;max-width:340px;border-radius:16px}
.m-box h3{margin-bottom:16px;text-align:center;font-size:16px}
.m-box input,.m-box textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;outline:none;font-size:14px;background:var(--bg);color:var(--text)}
.m-box textarea{height:120px;resize:none}
.m-btns{display:flex;gap:10px}
.m-btns button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
.b-c{background:var(--bg);color:var(--text)}
.b-ok{background:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
  <!-- Milk 首页 -->
  <div id="page-home">
    <div class="home-card">
      <div class="hc-date" id="home-date">2026 · 十一月8日</div>
      <div class="hc-greet" id="home-greet">晚上好</div>
      
      <div class="hc-section"><span id="home-name-title">TA</span> 今日状态</div>
      <div class="hc-status">
        <div class="icon">🥰</div>
        <div class="text"><h4>想你</h4><p>今天有点累，不过看到你的消息就开心了</p></div>
      </div>
      <div class="hc-grid">
        <div class="hc-box"><div class="ico">☁️</div><div class="lbl">TA 的天气</div><div class="val">绿意盎然</div></div>
        <div class="hc-box"><div class="ico">📍</div><div class="lbl">TA 的状态</div><div class="val">刚刚看到一朵云像你</div></div>
      </div>
      <div class="hc-btn" onclick="enterChat()">开始聊天</div>
    </div>
  </div>

  <!-- Milk 聊天页 -->
  <div id="page-chat">
    <div class="chat-top">
      <div class="ct-user" onclick="openSettings()">
        <div class="ct-av" id="av-other"></div>
        <div class="ct-info"><div class="ct-name" id="name-other">TA</div><div class="ct-status">在线</div></div>
      </div>
      <div class="ct-user">
        <div class="ct-info" style="align-items:flex-end"><div class="ct-name">我</div><div class="ct-status">在线</div></div>
        <div class="ct-av" id="av-me"></div>
      </div>
    </div>

    <div class="chat-mid" id="chat-list"></div>

    <div class="ctx-menu" id="ctx-menu">
      <div class="ctx-item" onclick="ctxReply()">↩ 回复</div>
      <div class="ctx-item" onclick="ctxEmoji()">😊 表情</div>
      <div class="ctx-item" onclick="ctxFav()">⭐ 收藏</div>
      <div class="ctx-item" onclick="ctxDel()">🗑 删除</div>
    </div>

    <div class="chat-bottom">
      <div class="input-bar">
        <button class="icon-btn">📹</button>
        <input type="text" id="msg-input" placeholder="发消息..." onkeydown="if(event.key==='Enter')sendText()">
        <button class="icon-btn">😀</button>
        <button class="icon-btn" onclick="openSettings()">＋</button>
      </div>
    </div>
  </div>

  <!-- Milk 完整设置面板 (新功能已缝合进高级功能) -->
  <div id="page-settings">
    <div class="set-hdr">
      <div class="set-back" onclick="closeSettings()">关闭</div>
      <div>设置</div>
      <div style="width:40px"></div>
    </div>
    <div class="set-inner">
      
      <div class="s-group">
        <div class="s-title">外观设置</div>
        <div class="s-row"><span>对方名字</span><input type="text" id="s-name"></div>
        <div class="s-row"><span>对方头像</span><label class="btn-up">选择<input type="file" accept="image/*" style="display:none" onchange="upImg(event,'otherAvatar')"></label></div>
        <div class="s-row"><span>我的头像</span><label class="btn-up">选择<input type="file" accept="image/*" style="display:none" onchange="upImg(event,'myAvatar')"></label></div>
      </div>

      <div class="s-group">
        <div class="s-title">聊天设置</div>
        <div class="s-row"><span>回复延迟(秒)</span><span><input type="number" id="s-min-d" value="3" style="width:50px"> ~ <input type="number" id="s-max-d" value="10" style="width:50px"></span></div>
        <div class="s-row"><span>开启主动消息</span><input type="checkbox" id="s-pro" onchange="toggleProactive()"></div>
      </div>

      <!-- 👇 这里就是你要的“高级功能”，全塞在这里了 👇 -->
      <div class="s-group">
        <div class="s-title">高级功能</div>
        <div class="s-row" onclick="openFunc('cards')"><span>🃏 字卡库 (管理回复)</span><span>→</span></div>
        <div class="s-row" onclick="openFunc('quiz')"><span>📝 问卷出题</span><span>→</span></div>
        <div class="s-row" onclick="openFunc('moment')"><span>🌐 发朋友圈</span><span>→</span></div>
        <div class="s-row" onclick="openFunc('rp')"><span>🧧 发红包</span><span>→</span></div>
      </div>

      <div class="s-group">
        <div class="s-title">数据管理</div>
        <div class="s-row" style="justify-content:center;color:red" onclick="resetAll()"><span>清空所有数据</span></div>
      </div>
    </div>
  </div>

  <!-- 弹窗区 -->
  <div class="modal" id="m-rp">
    <div class="m-box">
      <h3>发红包</h3>
      <input type="number" id="rp-amt" placeholder="金额 (元)">
      <input type="text" id="rp-desc" value="恭喜发财，大吉大利">
      <div class="m-btns"><button class="b-c" onclick="closeModal('m-rp')">取消</button><button class="b-ok" onclick="sendRP()">发红包</button></div>
    </div>
  </div>

  <div class="modal" id="m-quiz">
    <div class="m-box">
      <h3>问卷出题</h3>
      <input type="text" id="q-t" placeholder="问题...">
      <input type="text" id="q-a" placeholder="选项 A">
      <input type="text" id="q-b" placeholder="选项 B">
      <div class="m-btns"><button class="b-c" onclick="closeModal('m-quiz')">取消</button><button class="b-ok" onclick="sendQuiz()">让他作答</button></div>
    </div>
  </div>

  <div class="modal" id="m-moment">
    <div class="m-box">
      <h3>发朋友圈</h3>
      <textarea id="m-txt" placeholder="这一刻的想法..."></textarea>
      <div class="m-btns"><button class="b-c" onclick="closeModal('m-moment')">取消</button><button class="b-ok" onclick="sendMoment()">发布</button></div>
    </div>
  </div>

  <div class="modal" id="m-cards">
    <div class="m-box">
      <h3>字卡库 (换行批量添加)</h3>
      <textarea id="c-txt" placeholder="每行一条内容..."></textarea>
      <div class="m-btns"><button class="b-c" onclick="closeModal('m-cards')">取消</button><button class="b-ok" onclick="saveCards()">保存</button></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
let db={settings:[],cards:[],messages:[],moments:[]};
let settings={id:'main',sysName:'TA',otherAvatar:'',myAvatar:'',minDelay:3,maxDelay:10,proactive:false};
let currentMsgId=null;
let pressTimer=null;

function loadDB(){try{['settings','cards','messages','moments'].forEach(k=>db[k]=JSON.parse(localStorage.getItem(k)||'[]'));}catch(e){}}
function saveDB(){try{['settings','cards','messages','moments'].forEach(k=>localStorage.setItem(k,JSON.stringify(db[k])));}catch(e){}}

function init(){
  let s=db.settings.find(x=>x.id==='main');
  if(s) settings={...settings,...s}; else {db.settings.push(settings);saveDB();}
  applyTheme();
  
  const now=new Date();
  const months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  $('home-date').textContent = `${now.getFullYear()} · ${months[now.getMonth()]}${now.getDate()}日`;
  const hour = now.getHours();
  $('home-greet').textContent = hour<12?'早上好':(hour<18?'下午好':'晚上好');
  
  $('s-name').value = settings.sysName;
  $('s-name').oninput = (e) => { updSet('sysName', e.target.value); applyTheme(); };
  $('s-min-d').value = settings.minDelay;
  $('s-max-d').value = settings.maxDelay;
  $('s-min-d').onchange = (e) => updSet('minDelay', +e.target.value);
  $('s-max-d').onchange = (e) => updSet('maxDelay', +e.target.value);
  $('s-pro').checked = settings.proactive;
  
  if(!db.messages.length){
    db.messages.push({id:uid(), type:'time', content:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});
    saveDB();
  }
  renderMsgs();
}

function applyTheme(){
  $('name-other').textContent = settings.sysName;
  document.querySelectorAll('.home-name-title, .home-name-sub').forEach(el => el.textContent = settings.sysName);
  if(settings.otherAvatar) $('av-other').style.backgroundImage=`url(${settings.otherAvatar})`;
  if(settings.myAvatar) $('av-me').style.backgroundImage=`url(${settings.myAvatar})`;
}
function updSet(k,v){settings[k]=v;db.settings[0]=settings;saveDB();}

function upImg(e,type){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');let w=img.width,h=img.height,m=400;
    if(w>h&&w>m){h=Math.round(h*m/w);w=m;}else if(h>m){w=Math.round(w*m/h);h=m;}
    c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    updSet(type,c.toDataURL('image/jpeg',0.8));applyTheme();e.target.value='';
  };img.src=ev.target.result;};r.readAsDataURL(f);
}

function enterChat(){ $('page-home').style.opacity='0'; setTimeout(()=>{ $('page-home').style.display='none'; $('page-chat').classList.add('show'); },300); }
function openSettings(){ $('page-settings').classList.add('show'); }
function closeSettings(){ $('page-settings').classList.remove('show'); }

function openFunc(type){
  if(type==='rp') $('m-rp').style.display='flex';
  if(type==='quiz') $('m-quiz').style.display='flex';
  if(type==='moment') $('m-moment').style.display='flex';
  if(type==='cards') $('m-cards').style.display='flex';
}
function closeModal(id){ $(id).style.display='none'; }

/* ====== 聊天渲染 ====== */
function renderMsgs(){
  const l=$('chat-list');l.innerHTML='';
  [...db.messages].sort((a,b)=>a.ts-b.ts).forEach(m=>{
    if(m.type==='time'){ l.innerHTML+=`<div class="time-center">${m.content}</div>`; return; }
    const el=document.createElement('div'); el.className='msg '+(m.role==='user'?'mine':'other');
    const av=document.createElement('div'); av.className='av';
    if(m.role==='user'&&settings.myAvatar) av.style.backgroundImage=`url(${settings.myAvatar})`;
    if(m.role==='other'&&settings.otherAvatar) av.style.backgroundImage=`url(${settings.otherAvatar})`;
    const wrap=document.createElement('div'); wrap.className='wrap';
    const b=document.createElement('div'); b.className='bubble';
    b.innerHTML = m.content;
    
    b.addEventListener('touchstart',e=>{ startPress(e,m.id); });
    b.addEventListener('touchend',endPress);
    b.addEventListener('touchmove',endPress);
    b.addEventListener('mousedown',e=>{ startPress(e,m.id); });
    b.addEventListener('mouseup',endPress);
    b.addEventListener('mouseleave',endPress);
    
    // 双击拍一拍
    b.addEventListener('dblclick',()=>{ db.messages.push({id:uid(), role:'other', type:'text', content:`${settings.sysName}拍了拍你`, ts:Date.now()}); saveDB(); renderMsgs(); });

    wrap.appendChild(b);
    el.appendChild(av); el.appendChild(wrap);
    l.appendChild(el);
  });
  l.scrollTop = l.scrollHeight;
}

function startPress(e,id){
  currentMsgId=id;
  pressTimer=setTimeout(()=>{
    const menu=$('ctx-menu');
    const rect = e.target.getBoundingClientRect();
    menu.classList.add('show');
    menu.style.left = Math.max(10, rect.left + 10) + 'px';
    menu.style.top = Math.max(10, rect.top - 50) + 'px';
  },600);
}
function endPress(){ clearTimeout(pressTimer); }
document.addEventListener('click',e=>{ if(!e.target.closest('.bubble')) $('ctx-menu').classList.remove('show'); });

function ctxDel(){ $('ctx-menu').classList.remove('show'); db.messages=db.messages.filter(x=>x.id!==currentMsgId); saveDB(); renderMsgs(); }
function ctxReply(){ $('ctx-menu').classList.remove('show'); alert('回复'); }
function ctxEmoji(){ $('ctx-menu').classList.remove('show'); alert('表情'); }
function ctxFav(){ $('ctx-menu').classList.remove('show'); alert('收藏'); }

/* ====== 发送逻辑 ====== */
async function sendText(){
  const i=$('msg-input'), t=i.value.trim(); if(!t) return;
  db.messages.push({id:uid(), role:'user', type:'text', content:t, ts:Date.now()}); saveDB(); i.value=''; renderMsgs();
  const c=db.cards; if(!c.length) return;
  setTimeout(()=>{
    db.messages.push({id:uid(), role:'other', type:'text', content:c[Math.floor(Math.random()*c.length)].content, ts:Date.now()}); saveDB(); renderMsgs();
  }, 2000);
}

/* ====== 高级功能实现 ====== */
function sendRP(){
  const amt=$('rp-amt').value;
  if(!amt) return;
  db.messages.push({id:uid(), role:'user', type:'text', content:`[🧧 红包] ${$('rp-desc').value} (${amt}元)`, ts:Date.now()}); 
  saveDB(); closeModal('m-rp'); renderMsgs();
}
function sendQuiz(){
  const t=$('q-t').value, a=$('q-a').value, b=$('q-b').value;
  if(!t||!a||!b) return;
  const pick=Math.random()>0.5?a:b;
  db.messages.push({id:uid(), role:'other', type:'text', content:`关于“${t}”，我选：${pick}`, ts:Date.now()});
  saveDB(); closeModal('m-quiz'); renderMsgs();
}
function sendMoment(){ 
  const txt=$('m-txt').value.trim(); if(txt) { db.moments.push({id:uid(), content:txt, ts:Date.now()}); saveDB(); }
  closeModal('m-moment'); alert('动态已发布！');
}
function saveCards(){
  const lines=$('c-txt').value.split('\n').map(x=>x.trim()).filter(x=>x);
  lines.forEach(l=>{ db.cards.push({id:uid(), content:l}); });
  saveDB(); closeModal('m-cards'); alert(`成功添加${lines.length}条字卡！`);
}
function resetAll(){ if(confirm('确定清空所有数据？')){ localStorage.clear(); location.reload(); } }

function toggleProactive(){ updSet('proactive', $('s-pro').checked); }

init();
</script>
</body>
</html>

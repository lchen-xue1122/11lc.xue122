<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="google" content="notranslate">
<title>陪伴</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg-chat:#EDEDED;--bg-nav:#F7F7F7;--bg-input:#F7F7F7;--bubble-other:#FFF;--bubble-me:#95EC69;--text:#111;--text-secondary:#888;--accent:#07C160;--border:rgba(0,0,0,.08);--nav-bg:rgba(255,255,255,0.85)}
body.dark{--bg-chat:#111;--bg-nav:#1C1C1C;--bg-input:#1C1C1C;--bubble-other:#2C2C2C;--bubble-me:#3EB575;--text:#E5E5E5;--text-secondary:#888;--border:rgba(255,255,255,.08);--nav-bg:rgba(30,30,30,0.85)}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"PingFang SC",sans-serif;font-size:16px;color:var(--text);background:var(--bg-chat)}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:#111;z-index:9999;display:flex;justify-content:center;align-items:center;background-size:cover;background-position:center;transition:opacity .8s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash-text{color:#fff;font-size:24px;font-weight:bold;letter-spacing:2px;text-shadow:0 2px 4px rgba(0,0,0,.5)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}
.page{flex:1;display:none;flex-direction:column;overflow:hidden}
.page.active{display:flex}
#page-chat{position:relative}
.chat-bg-layer{position:absolute;top:44px;left:0;right:0;bottom:0;background-size:cover;background-position:center;z-index:0}
.chat-header{height:44px;background:var(--bg-nav);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;flex-shrink:0;z-index:10}
.header-avatar{width:28px;height:28px;border-radius:4px;background:#ccc;background-size:cover;background-position:center;display:none}
.chat-list{flex:1;overflow-y:auto;padding:12px 12px 90px 12px;display:flex;flex-direction:column;gap:12px;z-index:1;position:relative}
.msg{display:flex;gap:8px}
.msg.mine{flex-direction:row-reverse}
.msg .avatar{width:40px;height:40px;border-radius:4px;background:#ccc;background-size:cover;background-position:center;flex-shrink:0}
.msg .bubble-wrap{max-width:75%;display:flex;flex-direction:column}
.msg.mine .bubble-wrap{align-items:flex-end}
.msg .bubble{padding:8px 12px;border-radius:8px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word;background:var(--bubble-other);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg.mine .bubble{background:var(--bubble-me)}
.msg .bubble.img-sticker{background:transparent!important;padding:0;box-shadow:none}
.msg .bubble.img-sticker img{max-width:120px;max-height:120px;border-radius:8px;display:block}
.quote-box{background:rgba(0,0,0,.05);font-size:12px;padding:4px 8px;border-radius:4px;margin-bottom:4px;color:var(--text-secondary);border-left:2px solid var(--accent);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg-status{font-size:10px;color:var(--text-secondary);margin-top:4px;text-align:right}
.msg .time{font-size:11px;color:var(--text-secondary);margin-top:4px;display:none}
.msg.show-time .time{display:block}
.msg.system{justify-content:center;font-size:12px;color:var(--text-secondary);padding:4px 0;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.chat-input{display:flex;gap:6px;padding:8px;background:var(--bg-input);border-top:1px solid var(--border);flex-shrink:0;align-items:center;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:10}
.chat-input input[type="text"]{flex:1;padding:8px 12px;border-radius:4px;border:none;background:var(--bubble-other);color:var(--text);font-size:15px;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.chat-input button{padding:8px 12px;border-radius:4px;border:none;font-size:14px;cursor:pointer;white-space:nowrap;background:var(--accent);color:#fff;font-weight:500}
.btn-emoji{background:var(--bg-nav)!important;color:var(--text)!important;font-size:18px;padding:4px 8px!important}
.tabbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:90%;max-width:400px;background:var(--nav-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:30px;display:flex;justify-content:space-around;padding:8px 0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.tabbar button{background:none;border:none;font-size:12px;color:var(--text-secondary);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all .2s;flex:1}
.tabbar button.active{color:var(--accent);transform:scale(1.1)}
.tabbar button .icon{font-size:20px}
.page-inner{padding:12px;overflow-y:auto;flex:1;padding-bottom:100px}
.setting-row{background:var(--bubble-other);padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:12px}
.setting-row input[type=number]{width:70px;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);text-align:center}
.setting-row input[type=text]{flex:1;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);text-align:right;outline:none}
.section-title{font-size:12px;color:var(--text-secondary);margin:16px 4px 8px}
.btn-upload{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-size:13px;cursor:pointer}
.btn-danger{padding:6px 12px;border-radius:4px;border:1px solid #e74c3c;background:transparent;color:#e74c3c;font-size:13px;cursor:pointer}
.card-group{background:var(--bubble-other);border-radius:8px;margin-bottom:12px;overflow:hidden}
.card-group-header{padding:10px 12px;background:var(--bg-nav);font-size:14px;font-weight:500}
.card-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--border);font-size:14px;gap:8px}
.card-item .content{flex:1;word-break:break-all}
.card-item button{background:none;border:none;color:#e74c3c;font-size:13px;padding:4px;cursor:pointer}
.add-row{display:flex;gap:8px;margin-top:12px;margin-bottom:20px}
.add-row input{flex:1;padding:8px 12px;border-radius:4px;border:1px solid var(--border);background:var(--bubble-other);color:var(--text);outline:none}
.add-row button{padding:8px 12px;border-radius:4px;border:none;background:var(--accent);color:#fff;font-size:14px}
.modal-mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;justify-content:center;align-items:center;padding:20px}
.modal-content{background:var(--bubble-other);padding:16px;border-radius:8px;width:100%;max-width:400px;max-height:80vh;display:flex;flex-direction:column}
.modal-content h3{margin-bottom:12px;font-size:16px}
.modal-content textarea{width:100%;flex:1;min-height:100px;padding:8px;border-radius:4px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);resize:none;outline:none;margin-bottom:8px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.modal-btns button{padding:8px 16px;border-radius:4px;border:none;cursor:pointer}
.btn-cancel{background:var(--bg-nav);color:var(--text)}
.btn-confirm{background:var(--accent);color:#fff}
.emoji-panel{display:none;padding:10px;background:var(--bg-input);border-top:1px solid var(--border);flex-wrap:wrap;gap:12px;font-size:24px;max-height:200px;overflow-y:auto}
.emoji-panel span{cursor:pointer}
.emoji-panel img{width:40px;height:40px;object-fit:cover;border-radius:4px;cursor:pointer}
.emoji-tabs{display:flex;gap:10px;margin-bottom:10px;width:100%;border-bottom:1px solid var(--border);padding-bottom:5px}
.emoji-tabs div{font-size:14px;cursor:pointer;color:var(--text-secondary)}
.emoji-tabs div.active{color:var(--accent);font-weight:bold}
.theme-btn{display:inline-block;padding:6px 10px;border-radius:4px;margin-right:8px;margin-bottom:8px;cursor:pointer;border:1px solid var(--border);font-size:12px}
.color-picker{width:32px;height:32px;border:none;padding:0;background:none;cursor:pointer}
</style>
</head>
<body>
<div id="splash"><div id="splash-text">陪伴</div></div>
<div id="app">
  <!-- 聊天 -->
  <div class="page active" id="page-chat">
    <div class="chat-bg-layer" id="chat-bg-layer"></div>
    <div class="chat-header"><div class="header-avatar" id="header-avatar"></div><span id="header-name">对方</span></div>
    <div class="chat-list" id="chat-list"></div>
    <div class="emoji-panel" id="emoji-panel">
      <div class="emoji-tabs">
        <div class="active" onclick="switchEmojiTab('emoji')">Emoji</div>
        <div onclick="switchEmojiTab('sticker')">表情包</div>
      </div>
      <div id="emoji-tab-content" style="display:flex;flex-wrap:wrap;gap:12px;width:100%;"></div>
    </div>
    <div class="chat-input">
      <button class="btn-emoji" onclick="toggleEmoji()">😀</button>
      <input type="text" id="msg-input" placeholder="输入消息…" onkeydown="if(event.key==='Enter')sendText()">
      <button onclick="sendText()">发送</button>
    </div>
  </div>

  <!-- 问卷 -->
  <div class="page" id="page-quiz">
    <div class="chat-header">问卷出题</div>
    <div class="page-inner">
      <div class="setting-row"><input type="text" id="q-title" placeholder="你要问他的问题..."></div>
      <div class="setting-row"><input type="text" id="q-a" placeholder="选项 A"></div>
      <div class="setting-row"><input type="text" id="q-b" placeholder="选项 B"></div>
      <div class="setting-row"><input type="text" id="q-c" placeholder="选项 C"></div>
      <div class="setting-row"><input type="text" id="q-d" placeholder="选项 D"></div>
      <button onclick="submitQuiz()" style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:16px;margin-top:10px;">让他作答</button>
      <div class="section-title">历史问卷</div>
      <div id="quiz-list"></div>
    </div>
  </div>

  <!-- 朋友圈 -->
  <div class="page" id="page-moments">
    <div class="chat-header">朋友圈</div>
    <div class="page-inner" id="moments-list"></div>
    <div class="chat-input" style="padding-bottom: 90px;">
      <input type="text" id="moment-input" placeholder="这一刻的想法…">
      <button onclick="postMoment()">发布</button>
    </div>
  </div>

  <!-- 字卡 -->
  <div class="page" id="page-cards">
    <div class="page-inner">
      <div id="cards-list"></div>
      <div class="add-row">
        <input id="new-card" placeholder="单条添加…">
        <button onclick="addCard()">添加</button>
        <button onclick="openModal('batch-modal')" style="background:#007aff">批量</button>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div class="page" id="page-settings">
    <div class="page-inner">
      <div class="section-title">自定义美化 (点色块调色)</div>
      <div class="setting-row">
        <span>我的气泡色</span><input type="color" id="color-me" class="color-picker" onchange="updateSetting('colorMe',this.value);applyTheme()">
      </div>
      <div class="setting-row">
        <span>对方气泡色</span><input type="color" id="color-other" class="color-picker" onchange="updateSetting('colorOther',this.value);applyTheme()">
      </div>
      <div class="setting-row">
        <span>主题强调色</span><input type="color" id="color-accent" class="color-picker" onchange="updateSetting('colorAccent',this.value);applyTheme()">
      </div>
      <div class="setting-row"><span>夜间模式</span><input type="checkbox" id="set-dark" onchange="updateSetting('dark',this.checked);applyTheme()"></div>
      
      <div class="section-title">头像与背景</div>
      <div class="setting-row"><span>系统名称</span><input type="text" id="set-name" onchange="updateSetting('sysName',this.value);applyTheme()"></div>
      <div class="setting-row"><span>对方头像</span><label class="btn-upload">选择<input type="file" accept="image/*" style="display:none" onchange="uploadImage(event, 'otherAvatar')"></label></div>
      <div class="setting-row"><span>我的头像</span><label class="btn-upload">选择<input type="file" accept="image/*" style="display:none" onchange="uploadImage(event, 'myAvatar')"></label></div>
      <div class="setting-row"><span>聊天背景图</span><label class="btn-upload">选择<input type="file" accept="image/*" style="display:none" onchange="uploadImage(event, 'chatBg')"></label></div>
      <div class="setting-row"><span>开屏背景图</span><label class="btn-upload">选择<input type="file" accept="image/*" style="display:none" onchange="uploadImage(event, 'splashImage')"></label></div>
      <div class="setting-row"><span>时间戳常显</span><input type="checkbox" id="set-time" onchange="updateSetting('alwaysShowTime',this.checked);renderMessages()"></div>
      
      <div class="section-title">表情包（去设置添加）</div>
      <div class="setting-row">
        <span>添加自定义图片</span>
        <label class="btn-upload" style="background:var(--accent);color:#fff;border:none;">选择<input type="file" accept="image/*" style="display:none" onchange="uploadSticker(event)"></label>
      </div>
      <div id="sticker-manage-list" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;"></div>

      <div class="section-title">回复设置</div>
      <div class="setting-row"><span>回复条数</span><span><input type="number" id="set-min-count" min="1" onchange="updateSetting('minCount',+this.value)"> ~ <input type="number" id="set-max-count" min="1" onchange="updateSetting('maxCount',+this.value)"></span></div>
      <div class="setting-row"><span>延迟(秒)</span><span><input type="number" id="set-min-delay" min="1" onchange="updateSetting('minDelay',+this.value)"> ~ <input type="number" id="set-max-delay" min="1" onchange="updateSetting('maxDelay',+this.value)"></span></div>
      <div class="setting-row"><span>已读不回(%)</span><input type="number" id="set-no-reply" min="0" max="100" onchange="updateSetting('noReplyChance',+this.value)"></div>
      <div class="setting-row"><span>连句功能</span><input type="checkbox" id="set-multi" onchange="updateSetting('multiEnabled',this.checked)"></div>
      
      <div class="section-title">主动消息</div>
      <div class="setting-row"><span>开启主动消息</span><input type="checkbox" id="set-proactive" onchange="updateSetting('proactiveEnabled',this.checked);scheduleProactive()"></div>
      <div class="setting-row"><span>间隔(分钟)</span><span><input type="number" id="set-pro-min" min="1" onchange="updateSetting('proactiveMin',+this.value);scheduleProactive()"> ~ <input type="number" id="set-pro-max" min="1" onchange="updateSetting('proactiveMax',+this.value);scheduleProactive()"></span></div>

      <div class="section-title">数据</div>
      <div class="setting-row"><span>导出备份</span><button onclick="exportData()" class="btn-upload">导出</button></div>
      <div class="setting-row"><span>导入恢复</span><label class="btn-upload">导入<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label></div>
      <div class="setting-row"><span>重置全部数据</span><button onclick="resetData()" class="btn-danger">重置</button></div>
    </div>
  </div>

  <div class="tabbar">
    <button class="active" data-page="chat" onclick="switchTab('chat')"><span class="icon">💬</span>聊天</button>
    <button data-page="quiz" onclick="switchTab('quiz')"><span class="icon">📝</span>问卷</button>
    <button data-page="moments" onclick="switchTab('moments')"><span class="icon">🌐</span>朋友圈</button>
    <button data-page="cards" onclick="switchTab('cards')"><span class="icon">🃏</span>字卡</button>
    <button data-page="settings" onclick="switchTab('settings')"><span class="icon">⚙️</span>设置</button>
  </div>
</div>

<div class="modal-mask" id="batch-modal">
  <div class="modal-content">
    <h3>批量添加字卡</h3>
    <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">每行一条。支持 <b># 分组名</b>。<br>支持 <b>|w3</b> 表示权重3。</p>
    <textarea id="batch-input" placeholder="# 日常&#10;你好&#10;吃饭了吗|w3"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('batch-modal')">取消</button>
      <button class="btn-confirm" onclick="submitBatch()">确认</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const rInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const defSet={id:'main',dark:false,sysName:'对方',colorMe:'#95EC69',colorOther:'#FFFFFF',colorAccent:'#07C160',otherAvatar:'',myAvatar:'',chatBg:'',splashImage:'',minCount:1,maxCount:2,minDelay:3,maxDelay:10,noReplyChance:10,multiEnabled:false,alwaysShowTime:false,proactiveEnabled:false,proactiveMin:10,proactiveMax:30};
let db={settings:[],cards:[],messages:[],moments:[],stickers:[],quizzes:[]};
let settings={...defSet},currentEmojiTab='emoji';

function loadDB(){try{['settings','cards','messages','moments','stickers','quizzes'].forEach(k=>db[k]=JSON.parse(localStorage.getItem(k)||'[]'));}catch(e){}}
function saveDB(){try{['settings','cards','messages','moments','stickers','quizzes'].forEach(k=>localStorage.setItem(k,JSON.stringify(db[k])));}catch(e){alert('存储空间不足！');}}

function loadSettings(){
  let s=db.settings.find(x=>x.id==='main');
  if(s) settings={...settings,...s}; else {db.settings.push(settings);saveDB();}
  $('set-dark').checked=settings.dark; $('set-name').value=settings.sysName;
  $('color-me').value=settings.colorMe; $('color-other').value=settings.colorOther; $('color-accent').value=settings.colorAccent;
  $('set-min-count').value=settings.minCount; $('set-max-count').value=settings.maxCount;
  $('set-min-delay').value=settings.minDelay; $('set-max-delay').value=settings.maxDelay;
  $('set-no-reply').value=settings.noReplyChance; $('set-multi').checked=settings.multiEnabled;
  $('set-time').checked=settings.alwaysShowTime; $('set-proactive').checked=settings.proactiveEnabled;
  $('set-pro-min').value=settings.proactiveMin; $('set-pro-max').value=settings.proactiveMax;
  applyTheme(); scheduleProactive(); renderStickerManager();
  
  const splash=$('splash');
  if(settings.splashImage){splash.style.backgroundImage=`url(${settings.splashImage})`;$('splash-text').style.display='none';}
  setTimeout(()=>{splash.classList.add('hide');setTimeout(()=>splash.style.display='none',800);},1500);
}

function applyTheme(){
  document.body.classList.toggle('dark',!!settings.dark);
  $('header-name').textContent=settings.sysName;
  document.documentElement.style.setProperty('--bubble-me',settings.colorMe);
  document.documentElement.style.setProperty('--bubble-other',settings.colorOther);
  document.documentElement.style.setProperty('--accent',settings.colorAccent);
  if(settings.chatBg) $('chat-bg-layer').style.backgroundImage=`url(${settings.chatBg})`; else $('chat-bg-layer').style.backgroundImage='none';
  const hAv=$('header-avatar');
  if(settings.otherAvatar){hAv.style.display='block';hAv.style.backgroundImage=`url(${settings.otherAvatar})`;}else{hAv.style.display='none';}
}

function updateSetting(k,v){settings[k]=v;let i=db.settings.findIndex(x=>x.id==='main');if(i>=0)db.settings[i]=settings;saveDB();}

function uploadImage(e,type){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');let w=img.width,h=img.height,m=type==='splashImage'?800:(type==='chatBg'?1080:200);
    if(w>h&&w>m){h=Math.round(h*m/w);w=m;}else if(h>m){w=Math.round(w*m/h);h=m;}
    c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    updateSetting(type,c.toDataURL('image/jpeg',0.8));applyTheme();renderMessages();renderMoments();e.target.value='';
    if(type==='splashImage')alert('开屏图已设置，下次刷新生效');
  };img.src=ev.target.result;};r.readAsDataURL(f);
}

function uploadSticker(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');let w=img.width,h=img.height,m=100;
    if(w>h&&w>m){h=Math.round(h*m/w);w=m;}else if(h>m){w=Math.round(w*m/h);h=m;}
    c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    db.stickers.push({id:uid(),data:c.toDataURL('image/png')});saveDB();renderStickerManager();e.target.value='';
  };img.src=ev.target.result;};r.readAsDataURL(f);
}
function renderStickerManager(){
  const l=$('sticker-manage-list');l.innerHTML='';
  db.stickers.forEach(s=>{const d=document.createElement('div');d.style.position='relative';d.innerHTML=`<img src="${s.data}" style="width:40px;height:40px;border-radius:4px;object-fit:cover;"><div onclick="delSticker('${s.id}')" style="position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;justify-content:center;align-items:center;cursor:pointer;">×</div>`;l.appendChild(d);});
}
function delSticker(id){db.stickers=db.stickers.filter(x=>x.id!==id);saveDB();renderStickerManager();}

function switchTab(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
  $('page-'+n).classList.add('active');document.querySelector(`.tabbar button[data-page="${n}"]`).classList.add('active');
  if(n==='cards')renderCards();if(n==='moments')renderMoments();if(n==='quiz')renderQuizHistory();
}
function openModal(id){$(id).style.display='flex';}function closeModal(id){$(id).style.display='none';}

// 聊天逻辑
function renderMessages(){
  const list=$('chat-list');list.innerHTML='';
  [...db.messages].sort((a,b)=>a.ts-b.ts).forEach(m=>list.appendChild(renderMsgEl(m)));
  list.scrollTop=list.scrollHeight;
}
function renderMsgEl(m){
  const el=document.createElement('div');
  if(m.type==='system'){el.className='msg system';el.textContent=m.content;return el;}
  const isMine=m.role==='user';
  el.className='msg'+(isMine?' mine':'')+(settings.alwaysShowTime?' show-time':'');
  const av=document.createElement('div');av.className='avatar';
  if(isMine&&settings.myAvatar)av.style.backgroundImage=`url(${settings.myAvatar})`;
  else if(!isMine&&settings.otherAvatar)av.style.backgroundImage=`url(${settings.otherAvatar})`;
  const wrap=document.createElement('div');wrap.className='bubble-wrap';
  if(m.quote){const q=document.createElement('div');q.className='quote-box';q.textContent='引用: '+m.quote;wrap.appendChild(q);}
  const b=document.createElement('div');b.className='bubble';
  if(m.type==='sticker'){b.classList.add('img-sticker');b.innerHTML=`<img src="${m.content}">`;}else{b.textContent=m.content;}
  b.addEventListener('dblclick',()=>{db.messages.push({id:uid(),type:'system',content:`你拍了拍 "${settings.sysName}"`,ts:Date.now()});saveDB();renderMessages();});
  const t=document.createElement('div');t.className='time';t.textContent=new Date(m.ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  wrap.appendChild(b);wrap.appendChild(t);
  if(isMine){const s=document.createElement('div');s.className='msg-status';s.textContent='已读';wrap.appendChild(s);}
  el.appendChild(av);el.appendChild(wrap);
  b.addEventListener('click',()=>{if(!settings.alwaysShowTime)el.classList.toggle('show-time');});
  return el;
}

function toggleEmoji(){const p=$('emoji-panel');p.style.display=p.style.display==='flex'?'none':'flex';switchEmojiTab(currentEmojiTab);}
function switchEmojiTab(tab){
  currentEmojiTab=tab;document.querySelectorAll('.emoji-tabs div').forEach(d=>d.classList.remove('active'));
  document.querySelector(`.emoji-tabs div:nth-child(${tab==='emoji'?1:2})`).classList.add('active');
  const box=$('emoji-tab-content');box.innerHTML='';
  if(tab==='emoji'){
    ['😂','🥺','😘','❤️','💔','👍','🙏','🐶','🌹','😭','😡','🤔'].forEach(e=>{const s=document.createElement('span');s.textContent=e;s.onclick=()=>sendEmoji(e);box.appendChild(s);});
  }else{
    if(!db.stickers.length){box.innerHTML='<div style="font-size:12px;color:#888;">去设置里添加表情包</div>';return;}
    db.stickers.forEach(s=>{const img=document.createElement('img');img.src=s.data;img.onclick=()=>sendSticker(s.data);box.appendChild(img);});
  }
}
function sendEmoji(e){db.messages.push({id:uid(),role:'user',type:'text',content:e,ts:Date.now()});saveDB();renderMessages();toggleEmoji();}
function sendSticker(b){db.messages.push({id:uid(),role:'user',type:'sticker',content:b,ts:Date.now()});saveDB();renderMessages();toggleEmoji();if(Math.random()>0.3)autoReply("表情包");}

async function sendText(){
  const i=$('msg-input'),t=i.value.trim();if(!t)return;
  db.messages.push({id:uid(),role:'user',type:'text',content:t,ts:Date.now()});saveDB();i.value='';renderMessages();autoReply(t);
}
async function autoReply(userText){
  if(Math.random()*100<settings.noReplyChance)return;
  const c=db.cards;if(!c.length)return;
  const n=rInt(settings.minCount,settings.maxCount);
  const pool=[...c],picked=[];
  for(let i=0;i<n&&pool.length;i++){const idx=Math.floor(Math.random()*pool.length);picked.push(pool[idx]);pool.splice(idx,1);}
  const isQuote=Math.random()*100<30;
  for(const card of picked){
    await sleep(rInt(settings.minDelay,settings.maxDelay)*1000);
    let segs=[card.content];
    if(settings.multiEnabled&&c.length>1&&Math.random()<0.5){const ex=c[rInt(0,c.length-1)];if(ex.id!==card.id)segs.push(ex.content);}
    const content=segs.reduce((a,s,i)=>i===0?s:a+['，','。','…','~'][rInt(0,3)]+s,'');
    const m={id:uid(),role:'other',type:'text',content,ts:Date.now()};
    if(isQuote&&userText)m.quote=userText.slice(0,20)+(userText.length>20?'...':'');
    db.messages.push(m);saveDB();renderMessages();
  }
}

// 问卷逻辑
function submitQuiz(){
  let t=$('q-title').value.trim();let o=[$('q-a').value,$('q-b').value,$('q-c').value,$('q-d').value].map(x=>x.trim()).filter(x=>x);
  if(!t||o.length<2)return alert('请填写题目和至少两个选项');
  let pick=o[rInt(0,o.length-1)];
  db.quizzes.push({t,o,pick,ts:Date.now()});saveDB();
  db.messages.push({id:uid(),role:'other',type:'text',content:`关于“${t}”，我选：${pick}`,ts:Date.now()});saveDB();
  renderMessages();renderQuizHistory();
  $('q-title').value='';$('q-a').value='';$('q-b').value='';$('q-c').value='';$('q-d').value='';
  switchTab('chat');
}
function renderQuizHistory(){
  const l=$('quiz-list');l.innerHTML='';
  [...db.quizzes].sort((a,b)=>b.ts-a.ts).forEach(q=>{
    l.innerHTML+=`<div class="setting-row" style="flex-direction:column;align-items:flex-start;font-size:13px;"><div style="font-weight:bold;">Q: ${q.t}</div><div style="color:var(--text-secondary);margin:4px 0;">选项: ${q.o.join(' / ')}</div><div style="color:var(--accent);">他选择了: ${q.pick}</div></div>`;
  });
}

// 朋友圈逻辑
function renderMoments(){
  const l=$('moments-list');l.innerHTML='';
  const ms=[...db.moments].sort((a,b)=>b.ts-a.ts);
  if(!ms.length){l.innerHTML='<div style="text-align:center;color:#888;padding:40px;font-size:14px;">暂无动态</div>';return;}
  for(const m of ms){
    const el=document.createElement('div');el.className='moment';
    const av=m.author==='user'?(settings.myAvatar||''):(settings.otherAvatar||'');
    const name=m.author==='user'?'我':settings.sysName;
    const hasLiked=m.likes.includes('user');
    el.innerHTML=`<div class="moment-head"><div class="moment-avatar" style="background-image:url(${av})"></div><div class="moment-name">${name}</div></div><div class="moment-text">${m.content}</div>${m.likes.length?`<div class="moment-likes">❤️ ${m.likes.map(x=>x==='user'?'我':settings.sysName).join('，')}</div>`:''}<div class="moment-foot"><span>${new Date(m.ts).toLocaleTimeString()}</span><button onclick="toggleLike('${m.id}')" style="color:${hasLiked?'#e74c3c':'#576b95'};background:none;border:none;font-size:12px;">${hasLiked?'取消赞':'赞'}</button></div>`;
    l.appendChild(el);
  }
}
function postMoment(){const t=$('moment-input').value.trim();if(!t)return;db.moments.push({id:uid(),author:'user',content:t,ts:Date.now(),likes:[]});saveDB();$('moment-input').value='';renderMoments();}
function toggleLike(id){const m=db.moments.find(x=>x.id===id);if(!m)return;const i=m.likes.indexOf('user');if(i>=0)m.likes.splice(i,1);else m.likes.push('user');saveDB();renderMoments();}

// 字卡逻辑
function renderCards(){
  const c=$('cards-list');c.innerHTML='';const cards=db.cards;
  if(!cards.length){c.innerHTML='<div style="text-align:center;color:#888;padding:40px;font-size:14px;">还没有字卡</div>';return;}
  const g={};cards.forEach(card=>{const k=card.group||'未分组';if(!g[k])g[k]=[];g[k].push(card);});
  for(const [k,arr] of Object.entries(g)){
    const ge=document.createElement('div');ge.className='card-group';
    ge.innerHTML=`<div class="card-group-header">${k}（${arr.length}）</div>`;
    arr.forEach(card=>{
      const it=document.createElement('div');it.className='card-item';
      it.innerHTML=`<span class="content">${card.content}</span>${card.weight!==1?`<span style="font-size:12px;color:#999;">×${card.weight}</span>`:''}<button onclick="delCard('${card.id}')">删</button>`;
      ge.appendChild(it);
    });c.appendChild(ge);
  }
}
function addCard(){const i=$('new-card'),t=i.value.trim();if(!t)return;db.cards.push({id:uid(),content:t,weight:1,group:'未分组',enabled:true});saveDB();i.value='';renderCards();}
function delCard(id){if(!confirm('删除？'))return;db.cards=db.cards.filter(x=>x.id!==id);saveDB();renderCards();}
function submitBatch(){
  const txt=$('batch-input').value;const lines=txt.split('\n');let cur='未分组',cnt=0;
  for(let l of lines){
    l=l.trim();if(!l)continue;
    if(l.startsWith('#')){cur=l.slice(1).trim()||'未分组';continue;}
    let w=1;const m=l.match(/\|w(\d+)$/);
    if(m){w=Math.min(10,Math.max(1,parseInt(m[1])));l=l.replace(/\|w\d+$/,'').trim();}
    if(l){db.cards.push({id:uid(),content:l,weight:w,group:cur,enabled:true});cnt++;}
  }
  saveDB();closeModal('batch-modal');renderCards();alert(`成功添加 ${cnt} 条`);
}

// 主动消息
let proTimer=null;
function scheduleProactive(){
  if(proTimer)clearTimeout(proTimer);
  if(!settings.proactiveEnabled)return;
  const min=Math.max(1,settings.proactiveMin),max=Math.max(min,settings.proactiveMax);
  proTimer=setTimeout(()=>{
    const c=db.cards;if(c.length){db.messages.push({id:uid(),role:'other',type:'text',content:c[rInt(0,c.length-1)].content,ts:Date.now()});saveDB();renderMessages();}
    scheduleProactive();
  },rInt(min*60,max*60)*1000);
}

// 数据管理
function exportData(){
  const d={settings:db.settings,cards:db.cards,messages:db.messages,moments:db.moments,stickers:db.stickers,quizzes:db.quizzes};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='companion-bak.json';a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;if(!confirm('覆盖当前数据？'))return;
  const r=new FileReader();r.onload=ev=>{
    try{const d=JSON.parse(ev.target.result);['settings','cards','messages','moments','stickers','quizzes'].forEach(k=>{if(d[k])db[k]=d[k];});saveDB();alert('导入成功');location.reload();}catch(err){alert('格式错误');}
  };r.readAsText(f);
}
function resetData(){if(!confirm('清空所有数据？'))return;db={settings:[],cards:[],messages:[],moments:[],stickers:[],quizzes:[]};saveDB();location.reload();}

// 初始化
loadDB();loadSettings();renderMessages();renderCards();renderMoments();renderQuizHistory();
</script>
</body>
